name: Build Driftfin

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the job attach the APK to a release with the built-in token

# One release build at a time, so two runs can never pick the same build number.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest   # standard runner: free for public repositories
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full tag history: build numbers must survive release deletions

      - name: Pick the next build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build numbers follow the published releases (build-N), so a failed run does not use one up.
          # Deleting a GitHub release keeps its git tag, so take the max of both: a deleted release
          # can never lower or reuse a number. (Only deleting a tag too would break this - don't.)
          REL=$(gh release list --limit 300 --json tagName --jq '[.[].tagName | select(test("^build-[0-9]+$")) | ltrimstr("build-") | tonumber] | max // 0')
          TAGS=$(git tag -l 'build-*' | sed 's/^build-//' | sort -n | tail -1); TAGS=${TAGS:-0}
          LAST=$(( REL > TAGS ? REL : TAGS ))
          echo "BUILD_NUMBER=$((LAST + 1))" >> "$GITHUB_ENV"
          echo "Next build number: $((LAST + 1)) (releases max $REL, tags max $TAGS)"

      - name: Embed What's New notes
        run: |
          # The in-app What's New card reads the same RELEASE_NOTES.md section the GitHub release
          # gets, so the app always shows the build's real changes. Refuse to build without them:
          # a release with no notes is exactly the stale-Whats-New bug.
          TAG="build-${BUILD_NUMBER}"
          mkdir -p app/src/main/assets
          awk -v tag="$TAG" '/^## /{if(found)exit; if(tolower($0) ~ tolower(tag))found=1; next} found' RELEASE_NOTES.md | sed -n 's/^- //p' > app/src/main/assets/whatsnew.txt
          if [ ! -s app/src/main/assets/whatsnew.txt ]; then echo "RELEASE_NOTES.md has no bullet notes for $TAG; add them before building." >&2; exit 1; fi
          cat app/src/main/assets/whatsnew.txt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Require signing secrets
        env:
          B64: ${{ secrets.JETFLIX_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then echo "JETFLIX_KEYSTORE_B64 is not set; refusing to build with a throwaway key." >&2; exit 1; fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/jetflix-release.jks"

      - name: Unit tests
        # TV release track runs the TV module's tests; the phone module's tests run in the phone workflow.
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          JETFLIX_KEYSTORE_FILE: ${{ runner.temp }}/jetflix-release.jks
          JETFLIX_KEYSTORE_PASSWORD: ${{ secrets.JETFLIX_KEYSTORE_PASSWORD }}
          JETFLIX_KEY_ALIAS: ${{ secrets.JETFLIX_KEY_ALIAS }}
          JETFLIX_KEY_PASSWORD: ${{ secrets.JETFLIX_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Show APK hash and signer
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" jetflix-release.apk
          sha256sum jetflix-release.apk | tee jetflix-release.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs jetflix-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="build-${BUILD_NUMBER}"; fi
          # Notes come from RELEASE_NOTES.md (top section under the matching heading), so every
          # release lists its real changes. The standard footer is appended here.
          NOTES=$(awk -v tag="$TAG" '/^## /{if(found)exit; if(tolower($0) ~ tolower(tag))found=1; next} found' RELEASE_NOTES.md)
          if [ -z "$NOTES" ]; then NOTES="See RELEASE_NOTES.md for what changed in this build."; fi
          NOTES="$NOTES

          Automated build. Unit tests ran in CI, but this build was not run on a TV by CI. Known limits are listed in the README."
          gh release create "$TAG" jetflix-release.apk jetflix-release.apk.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Driftfin $TAG" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v7
        with:
          name: jetflix-release
          path: |
            jetflix-release.apk
            jetflix-release.apk.sha256
