name: Tests

on:
  workflow_dispatch:

# Verification-only counterpart to the two release workflows: runs every module's unit tests on
# the exact dispatched tree and publishes nothing. Used to gate integrated trees before a release.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: TV unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Phone unit tests
        run: gradle --no-daemon :phone:testDebugUnitTest
