name: Tests

on:
  workflow_dispatch:
    inputs:
      phone_filter:
        description: "Optional --tests filter for the phone suite (diagnostic isolation; empty = full suite)"
        default: ""
        type: string

# Verification-only counterpart to the two release workflows: runs every module's unit tests on
# the exact dispatched tree and publishes nothing. Used to gate integrated trees before a release.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: TV unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Phone unit tests
        if: always()
        run: |
          if [ -n "${{ inputs.phone_filter }}" ]; then
            gradle --no-daemon :phone:testDebugUnitTest --tests "${{ inputs.phone_filter }}"
          else
            gradle --no-daemon :phone:testDebugUnitTest
          fi

      - name: Phone test XML to log (diagnostic)
        if: always() && inputs.phone_filter != ''
        run: |
          shopt -s nullglob
          for f in phone/build/test-results/testDebugUnitTest/*.xml; do
            echo "===TESTXML $(basename "$f")==="
            cat "$f"
            echo "===END TESTXML==="
          done

      - name: QA captures to log (diagnostic)
        if: always()
        run: |
          shopt -s nullglob
          for f in app/build/outputs/qa/*.png; do
            printf '===QAPNG %s %s bytes===\n' "$(basename "$f")" "$(stat -c%s "$f")"
            base64 "$f"
            echo "===END QAPNG==="
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/qa/
            phone/build/reports/tests/
            phone/build/test-results/
